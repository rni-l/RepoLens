<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RepoLens · 项目库工作台 V1</title>
  <link rel="icon" type="image/svg+xml" href="assets/brand/repolens-mark.svg" />
  <link rel="stylesheet" href="assets/theme.css" />
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("repolens.theme.mode");
        var mode = stored === "dark" ? "dark" : "light";
        document.documentElement.dataset.themeMode = mode;
        document.documentElement.dataset.theme = mode;
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f4f5f7;
      --surface-warm: var(--surface);
      --fg: #0e1318;
      --fg-2: #3c4043;
      --muted: #5f6368;
      --meta: #9aa0a6;
      --border: #e1e3e6;
      --border-soft: var(--border);
      --accent: #7d2ae8;
      --accent-on: #ffffff;
      --accent-hover: #6815d4;
      --accent-active: color-mix(in oklab, var(--accent), black 14%);
      --success: #00b894;
      --warn: #ffb020;
      --danger: #ff5757;
      --font-display: "Canva Sans", "YS Text", system-ui, -apple-system, sans-serif;
      --font-body: "Canva Sans", "YS Text", system-ui, -apple-system, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
      --text-xs: 11px;
      --text-sm: 12px;
      --text-base: 14px;
      --text-lg: 16px;
      --text-xl: 18px;
      --text-2xl: 24px;
      --text-3xl: 36px;
      --text-4xl: 64px;
      --leading-body: 1.5;
      --leading-tight: 1.15;
      --tracking-display: -0.02em;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-12: 48px;
      --section-y-desktop: 96px;
      --section-y-tablet: 64px;
      --section-y-phone: 48px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-pill: 9999px;
      --elev-flat: none;
      --elev-ring: 0 0 0 1px var(--border);
      --elev-raised: 0 2px 8px rgba(0, 0, 0, 0.06);
      --focus-ring: 0 0 0 3px rgba(125, 42, 232, 0.16);
      --motion-fast: 180ms;
      --motion-base: 280ms;
      --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
      --container-max: 1320px;
      --container-gutter-desktop: 32px;
      --container-gutter-tablet: 24px;
      --container-gutter-phone: 16px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--surface);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: var(--leading-body);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    h1, h2, h3, p { margin: 0; }
    h1, h2, h3 { font-family: var(--font-display); letter-spacing: 0; text-wrap: balance; }
    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 208px minmax(0, 1fr);
    }
    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: var(--space-5) var(--space-4);
      border-right: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      gap: var(--space-6);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: var(--space-3);
      font-weight: 800;
      min-height: 40px;
    }
    .mark {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-md);
      box-shadow: 0 8px 22px color-mix(in oklab, var(--accent), transparent 72%);
    }
    .nav-list { display: grid; gap: var(--space-2); }
    .nav-item {
      min-height: 40px;
      display: grid;
      grid-template-columns: 30px 1fr;
      align-items: center;
      gap: var(--space-2);
      padding: 0 var(--space-3);
      border-radius: var(--radius-sm);
      color: var(--fg-2);
      font-weight: 700;
      transition: background var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
    }
    .nav-item:hover,
    .nav-item[aria-current="page"] {
      color: var(--accent);
      background: color-mix(in oklab, var(--accent), transparent 91%);
    }
    .nav-ico {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border-radius: var(--radius-sm);
      background: var(--surface);
      font-size: var(--text-xs);
      font-weight: 800;
      color: var(--muted);
    }
    .sidebar-foot {
      margin-top: auto;
      padding: var(--space-3);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      color: var(--muted);
      font-size: var(--text-sm);
    }
    .workspace {
      min-width: 0;
      padding: var(--space-6);
      display: grid;
      gap: var(--space-5);
    }
    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: var(--space-4);
      align-items: center;
    }
    .title-block h1 {
      font-size: clamp(var(--text-2xl), 3vw, var(--text-3xl));
      line-height: var(--leading-tight);
    }
    .title-block p {
      margin-top: var(--space-2);
      color: var(--muted);
      max-width: 760px;
    }
    .actions,
    .filters,
    .row-actions,
    .bulk-tags,
    .drawer-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-2);
    }
    .actions { justify-content: flex-end; }
    .btn,
    .chip,
    .icon-btn {
      min-height: 38px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      color: var(--fg);
      font-weight: 700;
      transition: transform var(--motion-fast) var(--ease-standard), box-shadow var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), background var(--motion-fast) var(--ease-standard);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      padding: 0 var(--space-4);
    }
    .btn:hover,
    .chip:hover,
    .icon-btn:hover {
      transform: translateY(-1px);
      box-shadow: var(--elev-raised);
      border-color: color-mix(in oklab, var(--border), var(--fg) 18%);
    }
    .btn-primary {
      border-color: transparent;
      color: var(--accent-on);
      background: linear-gradient(135deg, var(--accent), color-mix(in oklab, var(--accent), var(--success) 45%));
    }
    .btn-subtle,
    .chip.is-active {
      color: var(--accent);
      border-color: color-mix(in oklab, var(--accent), transparent 62%);
      background: color-mix(in oklab, var(--accent), transparent 92%);
    }
    .btn[disabled] {
      cursor: not-allowed;
      color: var(--meta);
      background: var(--surface);
      transform: none;
      box-shadow: none;
    }
    .icon-btn {
      width: 38px;
      padding: 0;
      display: grid;
      place-items: center;
      font-weight: 900;
    }
    .toolbar,
    .bulkbar,
    .table-card,
    .metric,
    .drawer,
    .toast {
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--bg);
      box-shadow: var(--elev-raised);
    }
    .toolbar {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;
      gap: var(--space-4);
      align-items: center;
      padding: var(--space-4);
    }
    .search-box {
      min-height: 44px;
      display: grid;
      grid-template-columns: 28px 1fr;
      align-items: center;
      padding: 0 var(--space-3);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
    }
    .search-box input {
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--fg);
    }
    .search-box:focus-within {
      border-color: var(--accent);
      box-shadow: var(--focus-ring);
      background: var(--bg);
    }
    .chip {
      padding: 0 var(--space-3);
      font-size: var(--text-sm);
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--space-4);
    }
    .metric { padding: var(--space-4); }
    .metric span {
      color: var(--muted);
      font-size: var(--text-sm);
    }
    .metric strong {
      display: block;
      margin-top: var(--space-1);
      font-family: var(--font-mono);
      font-size: var(--text-2xl);
      line-height: 1.1;
    }
    .bulkbar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-4);
      border-color: color-mix(in oklab, var(--accent), transparent 62%);
      background: color-mix(in oklab, var(--accent), transparent 94%);
    }
    .bulkbar.show { display: flex; }
    .bulk-copy { display: grid; gap: var(--space-1); }
    .bulk-copy strong { font-size: var(--text-lg); }
    .bulk-copy span { color: var(--muted); font-size: var(--text-sm); }
    .bulk-tags label {
      min-height: 32px;
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: 0 var(--space-3);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      background: var(--bg);
      color: var(--fg-2);
      font-size: var(--text-sm);
      font-weight: 700;
    }
    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }
    .table-card { overflow: hidden; }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    th,
    td {
      padding: var(--space-3) var(--space-4);
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: middle;
    }
    th {
      background: var(--surface);
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    tbody tr {
      transition: background var(--motion-fast) var(--ease-standard);
    }
    tbody tr:hover,
    tbody tr.is-selected {
      background: color-mix(in oklab, var(--accent), transparent 94%);
    }
    tbody tr[hidden] { display: none; }
    .col-check { width: 48px; }
    .col-project { width: 30%; }
    .col-tags { width: 22%; }
    .col-status { width: 108px; }
    .col-time { width: 150px; }
    .col-open { width: 190px; }
    .project-cell {
      min-width: 0;
      display: grid;
      gap: var(--space-1);
    }
    .project-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 800;
    }
    .path,
    .mono,
    .mobile-meta {
      font-family: var(--font-mono);
      color: var(--muted);
      font-size: var(--text-xs);
    }
    .path {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .mobile-meta { display: none; }
    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-1);
    }
    .tag {
      min-height: 24px;
      display: inline-flex;
      align-items: center;
      padding: 0 var(--space-2);
      border-radius: var(--radius-pill);
      background: var(--surface);
      color: var(--fg-2);
      font-size: var(--text-xs);
      font-weight: 800;
    }
    .tag.added {
      color: var(--accent);
      background: color-mix(in oklab, var(--accent), transparent 90%);
    }
    .status {
      width: max-content;
      min-height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 var(--space-3);
      border-radius: var(--radius-pill);
      background: color-mix(in oklab, var(--success), transparent 88%);
      color: color-mix(in oklab, var(--success), var(--fg) 24%);
      font-size: var(--text-xs);
      font-weight: 900;
    }
    .status.warn {
      background: color-mix(in oklab, var(--warn), transparent 86%);
      color: color-mix(in oklab, var(--warn), var(--fg) 34%);
    }
    .status.danger {
      background: color-mix(in oklab, var(--danger), transparent 90%);
      color: var(--danger);
    }
    .row-actions { justify-content: flex-end; }
    .tool {
      width: 30px;
      height: 30px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--fg-2);
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      font-weight: 900;
    }
    .tool:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--bg);
    }
    .drawer-layer {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      justify-content: flex-end;
      background: color-mix(in oklab, var(--fg), transparent 72%);
    }
    .drawer-layer.open { display: flex; }
    .drawer {
      width: min(520px, 100%);
      height: 100%;
      border-radius: var(--radius-lg) 0 0 var(--radius-lg);
      overflow: auto;
      animation: drawerIn var(--motion-base) var(--ease-standard);
    }
    @keyframes drawerIn {
      from { transform: translateX(28px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .drawer-head {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--space-4);
      padding: var(--space-5);
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    .drawer-body {
      display: grid;
      gap: var(--space-4);
      padding: var(--space-5);
    }
    .field {
      display: grid;
      gap: var(--space-2);
    }
    .field span,
    .field label {
      color: var(--muted);
      font-size: var(--text-sm);
      font-weight: 800;
    }
    .input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      color: var(--fg);
      padding: var(--space-3);
      outline: 0;
    }
    .input:focus {
      border-color: var(--accent);
      box-shadow: var(--focus-ring);
    }
    textarea.input { min-height: 104px; resize: vertical; }
    .toast {
      position: fixed;
      right: var(--space-6);
      bottom: var(--space-6);
      z-index: 50;
      max-width: 360px;
      padding: var(--space-4);
      color: var(--fg-2);
      transform: translateY(16px);
      opacity: 0;
      pointer-events: none;
      transition: transform var(--motion-base) var(--ease-standard), opacity var(--motion-base) var(--ease-standard);
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
    @media (max-width: 1180px) {
      .app-shell { grid-template-columns: 72px minmax(0, 1fr); }
      .sidebar { align-items: center; padding: var(--space-4); }
      .brand span,
      .nav-item span:last-child,
      .sidebar-foot { display: none; }
      .nav-item {
        width: 42px;
        grid-template-columns: 1fr;
        place-items: center;
        padding: 0;
      }
    }
    @media (max-width: 980px) {
      .toolbar,
      .topbar { grid-template-columns: 1fr; }
      .actions,
      .filters,
      .bulkbar { justify-content: flex-start; }
      .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .col-status,
      .col-time { display: none; }
      .mobile-meta { display: block; }
      .col-project { width: 42%; }
      .col-tags { width: 28%; }
    }
    @media (max-width: 720px) {
      .app-shell { display: block; }
      .sidebar {
        position: sticky;
        z-index: 20;
        top: 0;
        height: auto;
        flex-direction: row;
        justify-content: space-between;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }
      .brand span { display: inline; }
      .nav-list { grid-auto-flow: column; overflow-x: auto; max-width: 64vw; }
      .workspace { padding: var(--space-4); }
      .summary-grid { grid-template-columns: 1fr; }
      table, thead, tbody, tr, td { display: block; }
      thead { display: none; }
      tbody tr { padding: var(--space-3); border-bottom: 1px solid var(--border); }
      td { border-bottom: 0; padding: var(--space-2) 0; }
      td:first-child { padding-top: 0; }
      .row-actions { justify-content: flex-start; }
      .bulkbar { align-items: stretch; flex-direction: column; }
      .actions { justify-content: flex-start; }
    }
    @media (max-width: 430px) {
      .workspace { padding: var(--space-3); }
      .toolbar,
      .metric,
      .drawer-head,
      .drawer-body { padding: var(--space-3); }
      .actions,
      .filters,
      .drawer-actions { align-items: stretch; flex-direction: column; }
      .btn,
      .chip { width: 100%; }
      .toast { left: var(--space-3); right: var(--space-3); bottom: var(--space-3); }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" data-od-id="library-nav">
      <a class="brand" href="dashboard-v1.html" aria-label="RepoLens 项目库工作台">
        <img class="mark" src="assets/brand/repolens-mark.svg" alt="" width="34" height="34" />
        <span>RepoLens</span>
      </a>
      <nav class="nav-list" aria-label="主导航">
        <a class="nav-item" aria-current="page" href="dashboard-v1.html"><span class="nav-ico">库</span><span>项目库</span></a>
        <a class="nav-item" href="tags-v1.html"><span class="nav-ico">签</span><span>标签</span></a>
        <a class="nav-item" href="scan-sources-v1.html"><span class="nav-ico">扫</span><span>扫描源</span></a>
        <a class="nav-item" href="settings-v1.html"><span class="nav-ico">设</span><span>设置</span></a>
      </nav>
      <p class="sidebar-foot">紧凑导航保留核心入口，项目详情从列表按需打开。</p>
    </aside>

    <main class="workspace">
      <section class="topbar" data-od-id="library-topbar">
        <div class="title-block">
          <h1>项目库工作台</h1>
          <p>全宽浏览本地项目，按状态和层级标签筛选；多选项目后批量追加标签，单项目详情从右侧抽屉打开。</p>
        </div>
        <div class="actions">
          <a class="btn" href="scan-sources-v1.html">管理扫描源</a>
          <a class="btn" href="tags-v1.html">维护标签树</a>
          <button class="btn btn-primary" type="button" id="scan-all-btn">扫描全部</button>
        </div>
      </section>

      <section class="toolbar" data-od-id="library-filters">
        <label class="search-box" aria-label="搜索项目">
          <span aria-hidden="true">⌕</span>
          <input id="project-search" type="search" placeholder="搜索名称、路径、标签、状态或打开方式" autocomplete="off" />
        </label>
        <div class="filters" aria-label="筛选项目">
          <button class="chip is-active" type="button" data-filter="all">全部</button>
          <button class="chip" type="button" data-filter="active">活跃</button>
          <button class="chip" type="button" data-filter="experimental">实验</button>
          <button class="chip" type="button" data-filter="missing">缺失</button>
          <button class="chip" type="button" data-filter="water">水健康</button>
          <button class="chip" type="button" data-filter="cli">CLI 工具</button>
        </div>
      </section>

      <section class="summary-grid" data-od-id="library-summary" aria-label="项目概览">
        <article class="metric"><span>可见项目</span><strong id="visible-count">5</strong></article>
        <article class="metric"><span>已选择</span><strong id="selected-count">0</strong></article>
        <article class="metric"><span>本周更新</span><strong>3</strong></article>
        <article class="metric"><span>异常路径</span><strong id="missing-count">1</strong></article>
      </section>

      <section class="bulkbar" id="bulkbar" data-od-id="bulk-tag-toolbar" aria-live="polite">
        <div class="bulk-copy">
          <strong id="bulk-title">已选择 0 个项目</strong>
          <span>批量操作固定为追加标签，不覆盖原项目已有标签。</span>
        </div>
        <div class="bulk-tags" aria-label="选择要追加的标签">
          <label><input type="checkbox" value="维护状态 / 高频使用" data-bulk-tag />维护状态 / 高频使用</label>
          <label><input type="checkbox" value="技术栈 / Tauri" data-bulk-tag />技术栈 / Tauri</label>
          <label><input type="checkbox" value="业务域 / 水健康" data-bulk-tag />业务域 / 水健康</label>
          <button class="btn btn-primary" type="button" id="apply-tags-btn" disabled>追加标签</button>
        </div>
      </section>

      <section class="table-card" data-od-id="project-table" aria-label="项目列表">
        <table>
          <thead>
            <tr>
              <th class="col-check"><input id="select-all" type="checkbox" aria-label="全选当前可见项目" /></th>
              <th class="col-project">项目</th>
              <th class="col-tags">标签</th>
              <th class="col-status">状态</th>
              <th class="col-time">创建时间</th>
              <th class="col-time">最后更新</th>
              <th class="col-open">打开方式</th>
            </tr>
          </thead>
          <tbody id="project-body"></tbody>
        </table>
      </section>
    </main>
  </div>

  <div class="drawer-layer" id="drawer-layer" aria-hidden="true">
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <div class="drawer-head">
        <div>
          <h2 id="drawer-title">项目详情</h2>
          <p class="path" id="drawer-path">选择项目后显示路径</p>
        </div>
        <button class="icon-btn" type="button" id="close-drawer" aria-label="关闭详情抽屉">×</button>
      </div>
      <form class="drawer-body" id="detail-form">
        <label class="field">
          <span>项目名称</span>
          <input class="input" id="detail-name" />
        </label>
        <label class="field">
          <span>人工描述</span>
          <textarea class="input" id="detail-description"></textarea>
        </label>
        <label class="field">
          <span>启动命令</span>
          <input class="input mono" id="detail-start" />
        </label>
        <label class="field">
          <span>测试命令</span>
          <input class="input mono" id="detail-test" />
        </label>
        <div class="field">
          <span>当前标签</span>
          <div class="tag-row" id="detail-tags"></div>
        </div>
        <div class="drawer-actions">
          <a class="btn" href="tags-v1.html">编辑标签树</a>
          <button class="btn btn-subtle" type="button" id="suggest-tags">AI 建议标签</button>
          <button class="btn btn-primary" type="submit">保存人工字段</button>
        </div>
      </form>
    </aside>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">已完成</div>

  <script>
    const projects = [
      {
        id: "water",
        name: "water-product-transform-info",
        path: "/Users/ddd/D/feiyu/水健康-客服/code/water-product-transform-info",
        tags: ["业务域 / 水健康", "数据转换", "CLI 工具"],
        status: "active",
        statusText: "活跃",
        createdAt: "2026-06-14 09:18",
        updatedAt: "2026-06-22 10:44",
        description: "水健康客服数据转换工具，把产品资料转换成训练与知识库需要的结构化结果。",
        start: "pnpm dev",
        test: "pnpm test"
      },
      {
        id: "todo",
        name: "myself-todo",
        path: "/Users/ddd/Documents/myself-todo",
        tags: ["Web App", "自用核心"],
        status: "active",
        statusText: "活跃",
        createdAt: "2026-06-08 21:30",
        updatedAt: "2026-06-21 19:05",
        description: "个人任务管理应用，包含今日工作台、任务详情、快速添加和报告页。",
        start: "npm run dev",
        test: "npm test"
      },
      {
        id: "clean",
        name: "clean-transform-info",
        path: "/Users/ddd/D/feiyu/清洁客服/code/clean-transform-info",
        tags: ["业务域 / 清洁客服", "训练数据", "CLI 工具"],
        status: "experimental",
        statusText: "实验",
        createdAt: "2026-06-17 15:02",
        updatedAt: "2026-06-20 22:11",
        description: "清洁客服资料转换流程，输出 JSONL 批处理结果并对接训练映射。",
        start: "pnpm start",
        test: "pnpm test"
      },
      {
        id: "rag",
        name: "rag-agent",
        path: "/Users/ddd/Documents/rag-agent",
        tags: ["CLI 工具", "RAG", "高频使用"],
        status: "active",
        statusText: "活跃",
        createdAt: "2026-06-01 11:24",
        updatedAt: "2026-06-22 08:36",
        description: "基于表格用例驱动的 RAG 回归测试与产品参数问答实验工程。",
        start: "pnpm dev",
        test: "node --import tsx --test"
      },
      {
        id: "legacy",
        name: "legacy-client-site",
        path: "/Users/ddd/Archive/client/legacy-client-site",
        tags: ["未归类"],
        status: "missing",
        statusText: "缺失",
        createdAt: "2026-05-28 18:12",
        updatedAt: "2026-06-09 13:27",
        description: "历史客户站点记录，当前路径缺失，保留人工备注等待确认。",
        start: "",
        test: ""
      }
    ];

    const tbody = document.querySelector("#project-body");
    const search = document.querySelector("#project-search");
    const visibleCount = document.querySelector("#visible-count");
    const missingCount = document.querySelector("#missing-count");
    const selectedCount = document.querySelector("#selected-count");
    const selectAll = document.querySelector("#select-all");
    const bulkbar = document.querySelector("#bulkbar");
    const bulkTitle = document.querySelector("#bulk-title");
    const applyTagsButton = document.querySelector("#apply-tags-btn");
    const toast = document.querySelector("#toast");
    const drawerLayer = document.querySelector("#drawer-layer");
    const selected = new Set();
    let activeFilter = "all";
    let activeProject = projects[0];

    function statusClass(project) {
      if (project.status === "missing") return "status danger";
      if (project.status === "experimental") return "status warn";
      return "status";
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function renderRows() {
      tbody.innerHTML = projects.map((project) => `
        <tr data-id="${project.id}" data-status="${project.status}" data-search="${`${project.name} ${project.path} ${project.tags.join(" ")} ${project.statusText}`.toLowerCase()}">
          <td class="col-check"><input type="checkbox" aria-label="选择 ${project.name}" data-row-check value="${project.id}" /></td>
          <td>
            <div class="project-cell">
              <span class="project-name">${project.name}</span>
              <span class="path">${project.path}</span>
              <span class="mobile-meta">创建 ${project.createdAt} · 更新 ${project.updatedAt} · ${project.statusText}</span>
            </div>
          </td>
          <td><div class="tag-row">${project.tags.map((tag) => `<span class="tag">${tag}</span>`).join("")}</div></td>
          <td class="col-status"><span class="${statusClass(project)}">${project.statusText}</span></td>
          <td class="col-time mono">${project.createdAt}</td>
          <td class="col-time mono">${project.updatedAt}</td>
          <td>
            <div class="row-actions">
              <button class="tool" type="button" title="文件夹" data-open="文件夹">F</button>
              <button class="tool" type="button" title="终端" data-open="终端">T</button>
              <button class="tool" type="button" title="VS Code" data-open="VS Code">VS</button>
              <button class="tool" type="button" title="Cursor" data-open="Cursor">C</button>
            </div>
          </td>
        </tr>
      `).join("");
      bindRowEvents();
      applyFilters();
    }

    function projectById(id) {
      return projects.find((project) => project.id === id);
    }

    function openDrawer(project) {
      activeProject = project;
      document.querySelector("#drawer-title").textContent = project.name;
      document.querySelector("#drawer-path").textContent = project.path;
      document.querySelector("#detail-name").value = project.name;
      document.querySelector("#detail-description").value = project.description;
      document.querySelector("#detail-start").value = project.start;
      document.querySelector("#detail-test").value = project.test;
      document.querySelector("#detail-tags").innerHTML = project.tags.map((tag) => `<span class="tag">${tag}</span>`).join("");
      drawerLayer.classList.add("open");
      drawerLayer.setAttribute("aria-hidden", "false");
    }

    function closeDrawer() {
      drawerLayer.classList.remove("open");
      drawerLayer.setAttribute("aria-hidden", "true");
    }

    function bindRowEvents() {
      document.querySelectorAll("tbody tr").forEach((row) => {
        row.addEventListener("click", (event) => {
          if (event.target.closest("button, input, a")) return;
          openDrawer(projectById(row.dataset.id));
        });
      });
      document.querySelectorAll("[data-row-check]").forEach((checkbox) => {
        checkbox.addEventListener("change", () => {
          checkbox.checked ? selected.add(checkbox.value) : selected.delete(checkbox.value);
          updateSelectionUi();
        });
      });
      document.querySelectorAll("[data-open]").forEach((button) => {
        button.addEventListener("click", () => {
          const project = projectById(button.closest("tr").dataset.id);
          showToast(`将用 ${button.dataset.open} 打开 ${project.name}`);
        });
      });
    }

    function matchesFilter(project) {
      if (activeFilter === "all") return true;
      if (["active", "experimental", "missing"].includes(activeFilter)) return project.status === activeFilter;
      if (activeFilter === "water") return project.tags.join(" ").includes("水健康");
      if (activeFilter === "cli") return project.tags.join(" ").toLowerCase().includes("cli");
      return true;
    }

    function applyFilters() {
      const query = search.value.trim().toLowerCase();
      let visible = 0;
      let missing = 0;
      document.querySelectorAll("tbody tr").forEach((row) => {
        const project = projectById(row.dataset.id);
        const shown = matchesFilter(project) && (!query || row.dataset.search.includes(query));
        row.hidden = !shown;
        if (shown) visible += 1;
        if (shown && project.status === "missing") missing += 1;
      });
      visibleCount.textContent = String(visible);
      missingCount.textContent = String(missing);
      updateSelectionUi();
    }

    function updateSelectionUi() {
      const rows = Array.from(document.querySelectorAll("tbody tr"));
      rows.forEach((row) => {
        const checked = selected.has(row.dataset.id);
        row.classList.toggle("is-selected", checked);
        row.querySelector("[data-row-check]").checked = checked;
      });
      const selectedSize = selected.size;
      selectedCount.textContent = String(selectedSize);
      bulkTitle.textContent = `已选择 ${selectedSize} 个项目`;
      bulkbar.classList.toggle("show", selectedSize > 0);
      const visibleChecks = rows.filter((row) => !row.hidden).map((row) => row.querySelector("[data-row-check]"));
      selectAll.checked = visibleChecks.length > 0 && visibleChecks.every((checkbox) => checkbox.checked);
      selectAll.indeterminate = visibleChecks.some((checkbox) => checkbox.checked) && !selectAll.checked;
      updateBulkButton();
    }

    function updateBulkButton() {
      const tagCount = document.querySelectorAll("[data-bulk-tag]:checked").length;
      applyTagsButton.disabled = selected.size === 0 || tagCount === 0;
    }

    document.querySelectorAll("[data-filter]").forEach((chip) => {
      chip.addEventListener("click", () => {
        document.querySelectorAll("[data-filter]").forEach((item) => item.classList.remove("is-active"));
        chip.classList.add("is-active");
        activeFilter = chip.dataset.filter;
        applyFilters();
      });
    });
    search.addEventListener("input", applyFilters);
    selectAll.addEventListener("change", () => {
      document.querySelectorAll("tbody tr:not([hidden]) [data-row-check]").forEach((checkbox) => {
        checkbox.checked ? selected.delete(checkbox.value) : selected.add(checkbox.value);
        if (selectAll.checked) selected.add(checkbox.value);
      });
      updateSelectionUi();
    });
    document.querySelectorAll("[data-bulk-tag]").forEach((checkbox) => checkbox.addEventListener("change", updateBulkButton));
    applyTagsButton.addEventListener("click", () => {
      const tags = Array.from(document.querySelectorAll("[data-bulk-tag]:checked")).map((item) => item.value);
      selected.forEach((id) => {
        const project = projectById(id);
        tags.forEach((tag) => {
          if (!project.tags.includes(tag)) project.tags.push(tag);
        });
        project.updatedAt = "2026-06-22 16:28";
      });
      const count = selected.size;
      selected.clear();
      renderRows();
      showToast(`已为 ${count} 个项目追加 ${tags.length} 个标签`);
    });
    document.querySelector("#scan-all-btn").addEventListener("click", () => showToast("已开始扫描全部启用扫描源"));
    document.querySelector("#close-drawer").addEventListener("click", closeDrawer);
    drawerLayer.addEventListener("click", (event) => {
      if (event.target === drawerLayer) closeDrawer();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && drawerLayer.classList.contains("open")) closeDrawer();
    });
    document.querySelector("#detail-form").addEventListener("submit", (event) => {
      event.preventDefault();
      activeProject.description = document.querySelector("#detail-description").value;
      activeProject.start = document.querySelector("#detail-start").value;
      activeProject.test = document.querySelector("#detail-test").value;
      showToast("项目人工字段已保存");
      closeDrawer();
    });
    document.querySelector("#suggest-tags").addEventListener("click", () => showToast("已生成标签建议，可前往标签页确认层级位置"));
    renderRows();
  </script>
  <script src="assets/theme.js"></script>
</body>
</html>
